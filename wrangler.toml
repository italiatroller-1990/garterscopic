name = "garterscopic-docs"
compatibility_date = "2026-09-07"

# Static docs site deployed as a Cloudflare Workers asset bundle.
# Build MkDocs first, then Wrangler serves the generated files from ./site.
#
# This is the correct config for an assets-only Worker. Do NOT set a binding
# when using assets without a custom Worker script.

[build]
command = "python -m pip install -r requirements.txt && mkdocs build"

[assets]
directory = "./site"
not_found_handling = "404-page"

# If you later need a custom Worker script, add:
# main = "src/index.js"
# and only then use an asset binding.
