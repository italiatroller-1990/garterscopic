site_name: Garterscopic
site_url: https://garterscopic.example.com
repo_url: https://github.com/italiatroller-1990/garterscopic
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Project Structure: project-structure.md
  - Components: components.md
  - Packaging and Releases: packaging.md
  - Architecture:
      - Performance: architecture/performance.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
