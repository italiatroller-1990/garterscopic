name: post

layout: default

fields:
  title:
    type: string
    required: true

  description:
    type: string

  date:
    type: date
    required: true

  updated:
    type: date

  author:
    type: string

  tags:
    type: list

  section:
    type: string

  slug:
    type: string

  draft:
    type: boolean
    default: false
