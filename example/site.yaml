name: Example
base_url: http://localhost:8080

build:
  source: .
  output: dist

default_layout: default
default_page_type: page

assets:
  directory: assets

styles:
  global:
    - styles/global.css

responsive:
  mobile: "768px"
  tablet: "1024px"
  desktop: "1200px"
  viewport: "device-width"

sitemap:
  enabled: true

feed:
  enabled: true
  path: /feed.xml

taxonomy:
  tags: true
  categories: true

pagination:
  enabled: true
  per_page: 5

links:
  fail_on_broken: true
  highlight_active: true
  entries:
    - name: Home
      url: /
    - name: About
      url: /about/
    - name: Contact
      url: /contact/
