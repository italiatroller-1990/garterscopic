name: Example
base_url: http://localhost:8080

build:
  source: .
  output: dist

default_layout: default
default_page_type: page

assets:
  directory: assets

styles:
  global:
    - styles/global.css

sitemap:
  enabled: true

feed:
  enabled: true
  path: /feed.xml

taxonomy:
  tags: true
  categories: true

pagination:
  enabled: true
  per_page: 5

links:
  fail_on_broken: true
  entries:
    - name: Home
      url: /
    - name: About
      url: /about/
