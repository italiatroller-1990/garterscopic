name: Check Nix Flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        system: [x86_64-linux, aarch64-linux, x86_64-darwin, aarch64-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --all-systems

      - name: Build on ${{ matrix.system }}
        run: nix build .#garterscopic --system ${{ matrix.system }} --no-link --print-out-paths
        continue-on-error: true

      - name: Test package
        run: nix run .#garterscopic -- --version
