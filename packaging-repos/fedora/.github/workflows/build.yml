name: Build Fedora RPM Packages

on:
  repository_dispatch:
    types: [garterscopic-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version (e.g., v1.0.0)'
        required: true
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect-release:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new release
        id: check
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/garterscopic/garterscopic/releases/latest | jq -r .tag_name)
          LAST=$(cat .last-version 2>/dev/null || echo "")
          if [ "$LATEST" != "$LAST" ]; then
            echo "version=$LATEST" >> $GITHUB_OUTPUT
            echo "$LATEST" > .last-version
          else
            echo "No new version"
          fi

  build:
    needs: detect-release
    if: needs.detect-release.outputs.version != '' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: fedora:39
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.detect-release.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Install build dependencies
        run: |
          dnf install -y rpmdevtools rpmlint make gcc
          rpmdev-setuptree

      - name: Download binary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          case "${{ matrix.arch }}" in
            x86_64) PLATFORM="linux-amd64" ;;
            aarch64) PLATFORM="linux-arm64" ;;
          esac
          curl -sL "https://github.com/garterscopic/garterscopic/releases/download/${VERSION}/garterscopic-${PLATFORM}" -o garterscopic
          chmod +x garterscopic
          ls -la garterscopic
          file garterscopic

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/rpmbuild
          cp garterscopic /tmp/rpmbuild/
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          sed "s/%{VERSION}/${{ steps.version.outputs.version }}/g; s/%{ARCH}/${{ matrix.arch }}/g" \
            garterscopic.spec > ~/rpmbuild/SPECS/garterscopic.spec

          rpmbuild -ba ~/rpmbuild/SPECS/garterscopic.spec --define "_topdir $HOME/rpmbuild"

          mkdir -p dist
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp -v {} dist/ \;

      - name: Validate RPM
        run: |
          rpmlint dist/*.rpm
          rpm -qpi dist/*.rpm
          rpm -qpl dist/*.rpm

      - name: Test install in container
        run: |
          dnf install -y dist/*.rpm
          garterscopic --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: garterscopic-fedora-${{ matrix.arch }}
          path: dist/*.rpm

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Organize packages
        run: |
          mkdir -p dist
          find artifacts -name "*.rpm" -exec cp {} dist/ \;
          ls -la dist/

      - name: Create repository metadata
        run: |
          cd dist
          for rpm in *.rpm; do
            rpm -qpi "$rpm" >> /tmp/Packages.tmp
            echo "" >> /tmp/Packages.tmp
          done

          # Create repo metadata
          cat > garterscopic.repo << EOF
[garterscopic]
name=Garterscopic
baseurl=https://italiatroller-1990.github.io/garterscopic-fedora/dist
enabled=1
gpgcheck=0
EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
