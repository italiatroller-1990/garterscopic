name: Distro Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  debian-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build DEB package (amd64)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: amd64
        run: |
          VERSION="${VERSION#v}" ARCH=amd64 bash ./packaging/deb/build.sh
          ls -la *.deb

      - name: Validate DEB package
        run: |
          dpkg-deb --info *.deb
          dpkg-deb --contents *.deb

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-amd64
          path: "*.deb"
          retention-days: 5

  debian-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-arm64" -o garterscopic
          chmod +x garterscopic

      - name: Build DEB package (arm64)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: arm64
        run: |
          VERSION="${VERSION#v}" ARCH=arm64 bash ./packaging/deb/build.sh
          ls -la *.deb

      - name: Validate DEB package
        run: |
          dpkg-deb --info *.deb
          dpkg-deb --contents *.deb

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-arm64
          path: "*.deb"
          retention-days: 5

  fedora-rpm-amd64:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpm-build rpmdevtools curl

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build RPM package (amd64)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: x86_64
        run: |
          VERSION="${VERSION#v}" ARCH=x86_64 bash ./packaging/rpm/build.sh
          ls -la *.rpm

      - name: Validate RPM package
        run: |
          rpm -qip *.rpm
          rpm -qlp *.rpm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-fedora-amd64
          path: "*.rpm"
          retention-days: 5

  opensuse-rpm-amd64:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          zypper --non-interactive install rpm-build rpmdevtools curl

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build openSUSE RPM package (amd64)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: x86_64
        run: |
          VERSION="${VERSION#v}" ARCH=x86_64 bash ./packaging/rpm/build.sh
          ls -la *.rpm
          # Rename to distinguish from Fedora package
          for f in *.rpm; do
            mv "$f" "${f%.rpm}-opensuse.rpm"
          done
          ls -la *.rpm

      - name: Validate openSUSE RPM package
        run: |
          rpm -qip *.rpm
          rpm -qlp *.rpm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-opensuse-amd64
          path: "*-opensuse.rpm"
          retention-days: 5

  arch-package-amd64:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel curl

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build Arch package (amd64)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          
          # Create a PKGBUILD that installs the pre-built binary
          cat > PKGBUILD << 'HEREDOC'
pkgname=garterscopic
pkgver=$VERSION
pkgrel=1
pkgdesc="Declarative Lightweight Static Site Generator"
arch=('x86_64')
url="https://github.com/italiatroller-1990/garterscopic"
license=('Apache-2.0')
provides=("garterscopic")
conflicts=('garterscopic')

package() {
    install -Dm755 garterscopic "$pkgdir/usr/bin/garterscopic"
    install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
    install -Dm644 README.md "$pkgdir/usr/share/doc/$pkgname/README.md"
    install -Dm644 packaging/arch/bash_completion "$pkgdir/usr/share/bash-completion/completions/garterscopic"
    install -Dm644 packaging/arch/zsh_completion "$pkgdir/usr/share/zsh/site-functions/_garterscopic"
}
HEREDOC
          
          sed -i "s/\$VERSION/$VERSION/g" PKGBUILD
          makepkg --skippgpcheck --nocheck -f
          ls -la *.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-arch-amd64
          path: "*.pkg.tar.zst"
          retention-days: 5

  arch-package-arm64:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel curl

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-arm64" -o garterscopic
          chmod +x garterscopic

      - name: Build Arch package (arm64)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          
          # Create a PKGBUILD that installs the pre-built binary
          cat > PKGBUILD << 'HEREDOC'
pkgname=garterscopic
pkgver=$VERSION
pkgrel=1
pkgdesc="Declarative Lightweight Static Site Generator"
arch=('aarch64')
url="https://github.com/italiatroller-1990/garterscopic"
license=('Apache-2.0')
provides=("garterscopic")
conflicts=('garterscopic')

package() {
    install -Dm755 garterscopic "$pkgdir/usr/bin/garterscopic"
    install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
    install -Dm644 README.md "$pkgdir/usr/share/doc/$pkgname/README.md"
    install -Dm644 packaging/arch/bash_completion "$pkgdir/usr/share/bash-completion/completions/garterscopic"
    install -Dm644 packaging/arch/zsh_completion "$pkgdir/usr/share/zsh/site-functions/_garterscopic"
}
HEREDOC
          
          sed -i "s/\$VERSION/$VERSION/g" PKGBUILD
          makepkg --skippgpcheck --nocheck -f
          ls -la *.pkg.tar.zst
          # Rename to distinguish from amd64
          for f in *.pkg.tar.zst; do
            mv "$f" "${f%.pkg.tar.zst}-aarch64.pkg.tar.zst"
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-arch-arm64
          path: "*-aarch64.pkg.tar.zst"
          retention-days: 5
