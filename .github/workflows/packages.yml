name: Distro Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  debian-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build DEB package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION=$VERSION bash ./packaging/deb/build.sh
          ls -la *.deb

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: garterscopic-debian-package
          path: "*.deb"
          retention-days: 5

  rpm-package:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpmdevtools

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dnf install -y curl
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build RPM package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION=$VERSION bash ./packaging/rpm/build.sh
          ls -la *.rpm

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: garterscopic-rpm-package
          path: "*.rpm"
          retention-days: 5

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel curl

      - name: Download binary from release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL "https://github.com/italiatroller-1990/garterscopic/releases/download/${VERSION}/garterscopic-linux-amd64" -o garterscopic
          chmod +x garterscopic

      - name: Build Arch package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$HOME/.cache/garterscopic"
          cd "$HOME/.cache/garterscopic"
          cp "$PWD/../../../packaging/arch/PKGBUILD" .
          sed -i "s/{{VERSION}}/$VERSION/g" PKGBUILD
          cp "$PWD/../../../garterscopic" .
          makepkg --skippgpcheck -f
          ls -la *.pkg.tar.zst
          cp *.pkg.tar.zst "$PWD/../../../"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: garterscopic-arch-package
          path: "*.pkg.tar.zst"
          retention-days: 5
