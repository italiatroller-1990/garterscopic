name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            artifact: garterscopic-linux-amd64
          - os: linux
            arch: arm64
            artifact: garterscopic-linux-arm64
          - os: darwin
            arch: amd64
            artifact: garterscopic-darwin-amd64
          - os: darwin
            arch: arm64
            artifact: garterscopic-darwin-arm64
          - os: freebsd
            arch: amd64
            artifact: garterscopic-freebsd-amd64
          - os: freebsd
            arch: arm64
            artifact: garterscopic-freebsd-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build ${{ matrix.target.artifact }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION#v}" \
            -o ${{ matrix.target.artifact }} ./cmd/garterscopic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.artifact }}

  source-archive:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="garterscopic-${VERSION}-src.tar.gz"
          git archive --format=tar.gz --prefix="garterscopic-${VERSION}/" -o "$ARCHIVE" HEAD
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: garterscopic-source
          path: ${{ env.ARCHIVE }}

  checksums:
    needs: [build, source-archive]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f -not -name 'SHA256SUMS' -not -name '.git*' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS

  create-release:
    needs: [ci, checksums]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          chmod +x garterscopic-* 2>/dev/null || true
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Garterscopic ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            garterscopic-*
            SHA256SUMS
          body: |
            ## Downloads

            ### Binaries

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | amd64 | `garterscopic-linux-amd64` |
            | Linux | arm64 | `garterscopic-linux-arm64` |
            | macOS | amd64 | `garterscopic-darwin-amd64` |
            | macOS | arm64 | `garterscopic-darwin-arm64` |
            | FreeBSD | amd64 | `garterscopic-freebsd-amd64` |
            | FreeBSD | arm64 | `garterscopic-freebsd-arm64` |

            ### Packages

            | Distribution | Package | File |
|--------------|---------|------|
            | Fedora/RHEL | RPM | See [distro packages workflow](../../actions/workflows/packages.yml) |
            | openSUSE | RPM | See [distro packages workflow](../../actions/workflows/packages.yml) |
            | Debian | DEB | See [distro packages workflow](../../actions/workflows/packages.yml) |
            | Ubuntu | DEB | See [distro packages workflow](../../actions/workflows/packages.yml) |
            | Arch Linux | PKG | See [distro packages workflow](../../actions/workflows/packages.yml) |
            | Nix | Flake | See [packaging/nix/flake.nix](../blob/main/packaging/nix/flake.nix) |

            ### Go

            ```bash
            go install github.com/italiatroller-1990/garterscopic/cmd/garterscopic@${{ steps.version.outputs.version }}
            ```

            ### Source

            Download `garterscopic-${{ steps.version.outputs.version }}-src.tar.gz` or use:

            ```bash
            git clone --branch ${{ steps.version.outputs.version }} https://github.com/italiatroller-1990/garterscopic
            cd garterscopic
            CGO_ENABLED=0 go build -o garterscopic ./cmd/garterscopic
            ```

            ## Verification

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## Installation

            1. Download the binary for your platform
            2. Make it executable: `chmod +x garterscopic-<platform>-<arch>`
            3. Move it to your PATH: `sudo mv garterscopic-* /usr/local/bin/garterscopic`
            4. Verify: `garterscopic --version`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: [ci, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest binaries
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'garterscopic-*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distro-packages:
    needs: [ci, create-release]
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  trigger-packaging-repos:
    needs: [ci, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Debian packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-debian/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Trigger Fedora packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-fedora/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Trigger Arch packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-arch/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Trigger Nix flake update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-nix/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Done
        run: echo "All packaging repos notified for ${{ needs.create-release.outputs.version }}"
