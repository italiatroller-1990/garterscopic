name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify tag matches version pattern
        run: |
          if ! echo '${{ steps.version.outputs.version }}' | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version tag format"
            exit 1
          fi

      - name: Run full CI
        uses: ./.github/workflows/ci.yml
        with:
          skip-artifacts: true

  build:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            artifact: garterscopic-linux-amd64
          - os: linux
            arch: arm64
            artifact: garterscopic-linux-arm64
          - os: darwin
            arch: amd64
            artifact: garterscopic-darwin-amd64
          - os: darwin
            arch: arm64
            artifact: garterscopic-darwin-arm64
          - os: freebsd
            arch: amd64
            artifact: garterscopic-freebsd-amd64
          - os: freebsd
            arch: arm64
            artifact: garterscopic-freebsd-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build ${{ matrix.target.artifact }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.target.artifact }} ./cmd/garterscopic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.artifact }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS

  create-release:
    needs: [release, checksums]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare files
        run: |
          chmod +x garterscopic-*
          ls -la

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.version }}
          name: Garterscopic ${{ needs.release.outputs.version }}
          draft: false
          prerelease: false
          files: |
            garterscopic-*
            SHA256SUMS
          body: |
            ## Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | amd64 | `garterscopic-linux-amd64` |
            | Linux | arm64 | `garterscopic-linux-arm64` |
            | macOS | amd64 | `garterscopic-darwin-amd64` |
            | macOS | arm64 | `garterscopic-darwin-arm64` |
            | FreeBSD | amd64 | `garterscopic-freebsd-amd64` |
            | FreeBSD | arm64 | `garterscopic-freebsd-arm64` |

            ## Verification

            Check the `SHA256SUMS` file for checksums.

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## Installation

            1. Download the binary for your platform
            2. Make it executable: `chmod +x garterscopic-<platform>-<arch>`
            3. Move it to your PATH: `mv garterscopic-* /usr/local/bin/garterscopic`
            4. Run: `garterscopic --help`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: [release, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest binaries
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'garterscopic-*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distro-packages:
    needs: [release, create-release]
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.release.outputs.version }}

  trigger-packaging-repos:
    needs: [release, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Debian packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-debian/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.release.outputs.version }}\"}}"

      - name: Trigger Fedora packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-fedora/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.release.outputs.version }}\"}}"

      - name: Trigger Arch packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-arch/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.release.outputs.version }}\"}}"

      - name: Trigger Nix flake update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-nix/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.release.outputs.version }}\"}}"

      - name: Done
        run: echo "All packaging repos notified for ${{ needs.release.outputs.version }}"
