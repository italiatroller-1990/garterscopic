name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            artifact: garterscopic-linux-amd64
          - os: linux
            arch: arm64
            artifact: garterscopic-linux-arm64
          - os: darwin
            arch: amd64
            artifact: garterscopic-darwin-amd64
          - os: darwin
            arch: arm64
            artifact: garterscopic-darwin-arm64
          - os: freebsd
            arch: amd64
            artifact: garterscopic-freebsd-amd64
          - os: freebsd
            arch: arm64
            artifact: garterscopic-freebsd-arm64
          - os: windows
            arch: amd64
            artifact: garterscopic-windows-amd64
          - os: windows
            arch: arm64
            artifact: garterscopic-windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build ${{ matrix.target.artifact }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION#v}" \
            -o ${{ matrix.target.artifact }} ./cmd/garterscopic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.artifact }}

  source-archive:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="garterscopic-${VERSION}-src.tar.gz"
          git archive --format=tar.gz --prefix="garterscopic-${VERSION}/" -o "$ARCHIVE" HEAD
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: garterscopic-source
          path: ${{ env.ARCHIVE }}

  checksums:
    needs: [build, source-archive]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f -not -name 'SHA256SUMS' -not -name '.git*' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS

  create-release:
    needs: [ci, checksums]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          chmod +x garterscopic-* 2>/dev/null || true
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Garterscopic ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            garterscopic-*
            SHA256SUMS
          body: |
            ## 📥 Downloads

            ### 🖥️ Binaries

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | amd64 | `garterscopic-linux-amd64` |
            | Linux | arm64 | `garterscopic-linux-arm64` |
            | macOS | amd64 | `garterscopic-darwin-amd64` |
            | macOS | arm64 | `garterscopic-darwin-arm64` |
            | FreeBSD | amd64 | `garterscopic-freebsd-amd64` |
            | FreeBSD | arm64 | `garterscopic-freebsd-arm64` |
            | Windows | amd64 | `garterscopic-windows-amd64.exe` |
            | Windows | arm64 | `garterscopic-windows-arm64.exe` |

            ### 📦 Distribution Packages

            #### Debian/Ubuntu (DEB)
            ```bash
            sudo apt install ./garterscopic_${{ steps.version.outputs.version }}_amd64.deb
            ```

            #### Fedora/RHEL (RPM)
            ```bash
            sudo dnf install ./garterscopic-${{ steps.version.outputs.version }}-1.x86_64.rpm
            ```

            #### openSUSE (RPM)
            ```bash
            sudo zypper install ./garterscopic-${{ steps.version.outputs.version }}-1-opensuse.x86_64.rpm
            ```

            #### Arch Linux
            ```bash
            sudo pacman -U ./garterscopic-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst
            ```

            #### Nix
            See [packaging/nix/flake.nix](../../blob/main/packaging/nix/flake.nix) for flake configuration.

            ### 🐹 Go
            ```bash
            go install github.com/italiatroller-1990/garterscopic/cmd/garterscopic@${{ steps.version.outputs.version }}
            ```

            ### 📝 Source
            Download `garterscopic-${{ steps.version.outputs.version }}-src.tar.gz` or use:
            ```bash
            git clone --branch ${{ steps.version.outputs.version }} https://github.com/italiatroller-1990/garterscopic
            cd garterscopic
            CGO_ENABLED=0 go build -o garterscopic ./cmd/garterscopic
            ```

            ## ✅ Verification

            Verify file integrity:
            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## 🚀 Installation

            ### From Binary
            1. Download the binary for your platform
            2. Make it executable: `chmod +x garterscopic-<platform>-<arch>`
            3. Move to PATH: `sudo mv garterscopic-* /usr/local/bin/garterscopic`
            4. Verify: `garterscopic --version`

            ### From Distribution Package
            Use the installation commands above for your distribution.

            ## 📋 Release Notes

            For detailed changes, see the [full changelog](../../compare/${{ steps.version.outputs.version }}^...main).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: [ci, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest binaries
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'garterscopic-*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distro-packages:
    needs: [ci, create-release]
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish-packages:
    needs: [create-release, distro-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-packages

      - name: Organize packages
        run: |
          mkdir -p packages
          
          # Copy DEB packages
          find all-packages -name "*.deb" -type f -exec cp {} packages/ \;
          
          # Copy RPM packages
          find all-packages -name "*.rpm" -type f -exec cp {} packages/ \;
          
          # Copy Arch packages
          find all-packages -name "*.pkg.tar.zst" -type f -exec cp {} packages/ \;
          
          ls -lah packages/

      - name: Generate package checksums
        working-directory: packages
        run: |
          if [ -f SHA256SUMS ]; then rm SHA256SUMS; fi
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          echo "=== Package Checksums ==="
          cat SHA256SUMS

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        run: |
          if [ "$(ls -A packages/*.deb 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Uploading DEB packages..."
            gh release upload "$RELEASE_TAG" packages/*.deb --clobber
          fi
          
          if [ "$(ls -A packages/*.rpm 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Uploading RPM packages..."
            gh release upload "$RELEASE_TAG" packages/*.rpm --clobber
          fi
          
          if [ "$(ls -A packages/*.pkg.tar.zst 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Uploading Arch packages..."
            gh release upload "$RELEASE_TAG" packages/*.pkg.tar.zst --clobber
          fi
          
          if [ -f packages/SHA256SUMS ]; then
            echo "Uploading checksums..."
            gh release upload "$RELEASE_TAG" packages/SHA256SUMS --clobber
          fi
          
          echo "Package upload complete!"

      - name: Generate package summary
        run: |
          echo "## 📦 Distro Packages"
          echo ""
          echo "The following packages have been built and uploaded:"
          echo ""
          echo "### DEB Packages (Debian/Ubuntu)"
          ls -1 packages/*.deb 2>/dev/null | sed 's|.*/||' | sed 's/^/- `/' | sed 's/$`//' || echo "- None"
          echo ""
          echo "### RPM Packages (Fedora/openSUSE)"
          ls -1 packages/*.rpm 2>/dev/null | sed 's|.*/||' | sed 's/^/- `/' | sed 's/$`//' || echo "- None"
          echo ""
          echo "### Arch Packages"
          ls -1 packages/*.pkg.tar.zst 2>/dev/null | sed 's|.*/||' | sed 's/^/- `/' | sed 's/$`//' || echo "- None"

  trigger-packaging-repos:
    needs: [ci, create-release, publish-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Debian packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-debian/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Trigger Fedora packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-fedora/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Trigger Arch packaging repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-arch/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Trigger Nix flake update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PACKAGING_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/italiatroller-1990/garterscopic-nix/dispatches \
            -d "{\"event_type\": \"garterscopic-released\", \"client_payload\": {\"version\": \"${{ needs.create-release.outputs.version }}\", \"url\": \"https://github.com/italiatroller-1990/garterscopic/releases/tag/${{ needs.create-release.outputs.version }}\"}}"

      - name: Done
        run: echo "All packaging repos notified for ${{ needs.create-release.outputs.version }}"
